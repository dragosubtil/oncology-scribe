[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-transcription-lab"
version = "0.1.0"
description = "Local multilingual clinical ASR research and reproducible evaluation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "jiwer>=4.0,<5",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2"]
ui = ["gradio>=6,<7"]
data = ["pyarrow>=25,<26", "huggingface-hub>=1,<2", "praatio>=6,<7"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
clinical-asr = "clinical_asr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_asr = ["assets/*.css", "assets/*.js", "assets/icons/*.svg", "assets/icons/LICENSE", "assets/dialogues/*.json", "assets/dialogues/*.wav", "assets/dialogues/*.txt", "assets/dialogues/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
